name: Build
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/build-app.sh "dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with: { name: BTCMenuBar, path: dist/BTCMenuBar.zip }
