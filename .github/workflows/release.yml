name: Release
# Publishes a GitHub release with BTCMenuBar.zip. The app's "Check for Updates…" installs the newest one.
# Release by pushing a tag (git tag v1.0.1 && git push origin v1.0.1) or from the Actions tab with a version.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
    inputs:
      version: { description: 'Version tag to create, e.g. v1.0.1', required: true }
permissions: { contents: write }
jobs:
  release:
    runs-on: macos-14
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must look like v1.2.3"; exit 1; }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: scripts/build-app.sh "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: BTCMenuBar ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/BTCMenuBar.zip
